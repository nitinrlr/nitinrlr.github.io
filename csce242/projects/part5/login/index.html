<!DOCTYPE html>
<html>
    <head>
        <title>MovieBuzz - Login</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <a href="../homepage/index.html" class="logo">MOVIE<span>BUZZ</span></a>
            <nav>
                <ul>
                    <li><a href="../homepage/index.html">Home</a></li>
                    <li><a href="../browse/index.html">Browse</a></li>
                    <li><a href="../about/index.html">About Us</a></li>
                    <li><a href="index.html" class="active">Login</a></li>
                </ul>
            </nav>
            <input type="search" placeholder="Search...">
        </header>
        <main class="login-main">
            <section class="login-card">
                <p class="logo">MOVIE<span>BUZZ</span></p>
                <form>
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Password">
                    <a href="#" class="forgot">Forgot Password?</a>
                    <button type="submit" class="sign-in">Sign In</button>
                </form>
                <p class="divider">or</p>
                <p class="signup">
                    Don't have an account? <a href="#">Sign Up</a>
                </p>
            </section>
        </main>
    </body>
</html>
