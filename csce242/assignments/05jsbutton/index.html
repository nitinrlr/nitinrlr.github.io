<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Introduction to JavaScript</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div id="content">
            <header>
                <h1>Assignment 5</h1>
                <h2>Introduction to JavaScript</h2>
            </header>
            <main>
                <section class="columns">
                    <article id="speech" class="column">
                        <h3>Speech</h3>
                        <div id="speech-bubble">
                            <p>Hi</p>
                            <div id="speech-triangle"></div>
                        </div>
                    </article>
                    <article id="beverage" class="column">
                        <h3>Beverage</h3>
                        <label for="drink">
                            Pick your morning beverage:
                        </label>
                        <select id="drink">
                            <option value="coffee">Coffee</option>
                            <option value="tea">Tea</option>
                            <option value="orange-juice">Orange Juice</option>
                            <option value="water">Water</option>
                        </select>
                        <p id="drink-message"></p>
                    </article>
                    <article id="sticker" class="column">
                        <h3>Add a Sticker</h3>
                        <img id ="sun" src="images/sun.jpg" alt="sun-sticker">
                    </article>
                </section>
            </main>
            <footer>
                <p>&copy; nitinbhupatiraju</p>
            </footer>
        </div>
        <script src="script.js"></script>
    </body>
</html>
